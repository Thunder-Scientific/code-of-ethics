# Pages CMS (app.pagescms.org) configuration.
#
# Ethics Committee members edit the rulebook through this config on the
# `staging` branch. Pages CMS reads .pages.yml per branch, so it must exist on
# `staging`; it lives on `main` too only so the two do not drift.
#
# What is deliberately NOT here: archive/ (retired rules), website/ (site
# config) and .github/ (CI). A path becomes editable only by appearing as a
# collection below, so leaving them out is what keeps them out of the CMS.
#
# Why the body field is `text` and not `rich-text`:
# a WYSIWYG editor reflows markdown on save and would strip the {#id} anchors
# that every citable heading carries. Those anchors are published addresses --
# moderators link to /section-b/b1/#unit-4 from appeals and mod logs. Editors
# see raw markdown instead, and CI fails the build if an anchor goes missing.
#
# Do not rename a rule file. section-b/b1.md IS the URL /section-b/b1/.

media:
  - name: images_about
    label: About images
    input: about/images
    output: images
  - name: images_section_b
    label: Section B images
    input: section-b/images
    output: images
  - name: images_section_c
    label: Section C images
    input: section-c/images
    output: images
  - name: images_section_d
    label: Section D images
    input: section-d/images
    output: images
  - name: images_section_i
    label: Section I images
    input: section-i/images
    output: images

content:
  - name: about
    label: About
    type: collection
    path: about
    filter: "*.md"
    media: images_about
    fields:
      - name: body
        label: Page (markdown)
        type: text
        options:
          minlength: 1

  - name: section_a
    label: Section A
    type: collection
    path: section-a
    filter: "*.md"
    fields:
      - name: body
        label: Page (markdown)
        type: text
        options:
          minlength: 1

  - name: section_b
    label: Section B
    type: collection
    path: section-b
    filter: "*.md"
    media: images_section_b
    fields:
      - name: body
        label: Page (markdown)
        type: text
        options:
          minlength: 1

  - name: section_c
    label: Section C
    type: collection
    path: section-c
    filter: "*.md"
    media: images_section_c
    fields:
      - name: body
        label: Page (markdown)
        type: text
