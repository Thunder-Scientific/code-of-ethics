name: Site

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: self-hosted
    concurrency:
      group: site-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      # Fails on broken links, broken anchors in links, and unresolvable images.
      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: self-hosted
    concurrency:
      group: site-${{ github.ref }}-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
