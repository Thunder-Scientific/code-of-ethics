# Reusable build. Not triggered directly — called by pr.yml and deploy.yml.
name: Build site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: website
        run: bun ci
      - name: Build
        working-directory: website
        run: bun run build
